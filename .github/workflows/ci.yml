name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Build & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno install --frozen
      - run: deno task check
      - run: deno task lint
      - run: deno task test
      - run: deno task build
