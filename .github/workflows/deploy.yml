name: deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Deno Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for Deno Deploy OIDC auth
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          # One-time setup: create a project at https://dash.deno.com, link this
          # repo, and ensure the project name below matches.
          project: arcana-of-code
          entrypoint: build/index.js
